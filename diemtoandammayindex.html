<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý nhân sự</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f5fa;
    margin: 0;
    padding: 30px;
}
.container {
    max-width: 1000px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
}
h1 {
    color: #2457a7;
    text-align: center;
}
input, button {
    padding: 10px;
    margin: 5px 0;
    box-sizing: border-box;
}
input {
    border: 1px solid #ccc;
    border-radius: 5px;
}
button {
    background: #2457a7;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 15px 0;
}
form input {
    flex: 1 1 180px;
}
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}
th, td {
    padding: 12px;
    border: 1px solid #ddd;
    text-align: left;
}
th {
    background: #2457a7;
    color: white;
}
</style>
</head>
<body>
<div class="container">
    <h1>QUẢN LÝ NHÂN SỰ</h1>

    <input id="timkiem" placeholder="Tìm kiếm nhân viên..."
           oninput="hienThi()" style="width:100%">

    <h3>Thêm nhân viên</h3>
    <form id="formNV">
        <input id="hoten" placeholder="Họ tên" required>
        <input id="phongban" placeholder="Phòng ban" required>
        <input id="chucvu" placeholder="Chức vụ" required>
        <input id="email" type="email" placeholder="Email" required>
        <button type="submit">Thêm nhân viên</button>
    </form>

    <h3>Danh sách nhân viên</h3>
    <table>
        <thead>
            <tr>
                <th>Mã NV</th>
                <th>Họ tên</th>
                <th>Phòng ban</th>
                <th>Chức vụ</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody id="danhsach"></tbody>
    </table>
</div>

<script>
let nhanVien = [
    {id: 1, ho_ten: "Nguyen Van An",
     phong_ban: "Ke toan", chuc_vu: "Nhan vien",
     email: "an@example.com"},
    {id: 2, ho_ten: "Tran Thi Binh",
     phong_ban: "Kinh doanh", chuc_vu: "Truong phong",
     email: "binh@example.com"}
];

function hienThi() {
    let tuKhoa = document.getElementById("timkiem").value.toLowerCase();

    let ketQua = nhanVien.filter(nv =>
        Object.values(nv).some(v =>
            String(v).toLowerCase().includes(tuKhoa)
        )
    );

    document.getElementById("danhsach").innerHTML =
        ketQua.map(nv => `
            <tr>
                <td>${nv.id}</td>
                <td>${nv.ho_ten}</td>
                <td>${nv.phong_ban}</td>
                <td>${nv.chuc_vu}</td>
                <td>${nv.email}</td>
            </tr>
        `).join("");
}

document.getElementById("formNV").onsubmit = function(e) {
    e.preventDefault();

    nhanVien.push({
        id: Math.max(0, ...nhanVien.map(nv => nv.id)) + 1,
        ho_ten: document.getElementById("hoten").value,
        phong_ban: document.getElementById("phongban").value,
        chuc_vu: document.getElementById("chucvu").value,
        email: document.getElementById("email").value
    });

    this.reset();
    hienThi();
};

hienThi();
</script>
</body>
</html>

<script>
  // 2. Khai báo thông tin kết nối từ Supabase của anh/thầy
  const SUPABASE_URL = 'https://tlpntwsoarbjkymnbllh.supabase.co';
  const SUPABASE_ANON_KEY = 'DIỀN_CHUỖI_PUBLISHABLE_KEY_VÀO_ĐÂY'; // Paste chuỗi sb_publishable_... vừa copy vào đây

  // 3. Khởi tạo đối tượng supabase client
  const { createClient } = supabase;
  const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // --- 4. HÀM TEST KẾT NỐI & LẤY DỮ LIỆU TỪ BẢNG nhan_vien ---
  async function loadNhanVien() {
    const { data, error } = await _supabase
      .from('nhan_vien')
      .select('*');

    if (error) {
      console.error('Lỗi kết nối hoặc truy vấn:', error.message);
      return;
    }

    console.log('Danh sách nhân viên lấy từ Supabase:', data);
    // TODO: Viết tiếp code đổ dữ liệu (data) ra giao diện bảng HTML của anh/thầy ở đây
  }

  // Gọi hàm test khi trang được tải xong
  window.onload = function() {
    loadNhanVien();
  };
</script>
